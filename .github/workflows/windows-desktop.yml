name: Windows desktop build (baseline)

# Baseline build of stock RealRTCW for Windows x64, using the project's own
# MSYS2/MinGW route. This proves the CI pipeline works before any Xbox/UWP
# changes are made.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ffmpeg

      - name: Build (non-Steam)
        run: ARCH=x86_64 make -j"$(nproc)"

      - name: List outputs
        run: find build -maxdepth 3 \( -name '*.exe' -o -name '*.dll' \) | sort

      - uses: actions/upload-artifact@v4
        with:
          name: realrtcw-win64-desktop
          path: |
            build/release-mingw*-x86_64/**/*.exe
            build/release-mingw*-x86_64/**/*.dll
          if-no-files-found: error
