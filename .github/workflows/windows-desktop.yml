name: Windows desktop build (baseline)

# Baseline build of stock RealRTCW for Windows x64, using the project's own
# MSYS2/MinGW route. This proves the CI pipeline works before any Xbox/UWP
# changes are made.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ffmpeg

      - name: Build (non-Steam)
        run: ARCH=x86_64 make -j"$(nproc)"

      - name: Stage outputs
        run: |
          mkdir -p dist
          # Output dir is build/release-<platform>-<arch>-<flavor>; copy
          # binaries out keeping their relative layout (main/ holds game DLLs).
          cd build/release-*
          find . \( -name '*.exe' -o -name '*.dll' \) -not -path '*/obj/*' -print \
            | tee ../../dist/FILES.txt \
            | while read -r f; do mkdir -p "../../dist/$(dirname "$f")"; cp "$f" "../../dist/$f"; done
          test -s ../../dist/FILES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: realrtcw-win64-desktop
          path: dist/
          if-no-files-found: error
