name: Windows MSVC build

# Builds the desktop x64 client and game modules with Visual Studio (MSVC) via
# CMake. This is the stepping stone to the Xbox (UWP) build, which also needs
# MSVC. FFmpeg (for cinematics) comes from vcpkg and is cached between runs.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-

      # Install dependencies as a separate step so failures are easy to spot
      # and whatever did build gets cached even if a later step fails.
      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-install-root="${{ github.workspace }}\vcpkg_installed" 2>&1 | Tee-Object -FilePath vcpkg.log
          exit $LASTEXITCODE

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" `
            -DVCPKG_MANIFEST_INSTALL=OFF 2>&1 | Tee-Object -FilePath configure.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /v:minimal /clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Raw logs can't always be fetched remotely, so surface the first
      # errors as a run annotation (visible in the run summary).
      - name: Summarize errors
        if: failure()
        shell: pwsh
        run: |
          $lines = @()
          if (Test-Path build.log) {
            $lines += Select-String -Path build.log -Pattern ': (fatal )?error' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 60
          }
          if ($lines.Count -eq 0) {
            foreach ($f in 'configure.log','vcpkg.log') {
              if (Test-Path $f) { $lines += "== $f"; $lines += Get-Content $f -Tail 45; break }
            }
            foreach ($f in 'build\CMakeFiles\CMakeConfigureLog.yaml') {
              if (Test-Path $f) { $lines += "== $f"; $lines += Get-Content $f -Tail 30 }
            }
          }
          # vcpkg port build logs, if a port failed
          Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter '*-err.log' -ErrorAction SilentlyContinue |
            Select-Object -First 2 | ForEach-Object { $lines += "== $($_.Name)"; $lines += Get-Content $_.FullName -Tail 25 }
          $msg = ($lines | ForEach-Object { $_ -replace '%','%25' -replace "`r",'' }) -join '%0A'
          Write-Output "::error title=Build errors::$msg"

      - name: Stage outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\out\* dist\
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: realrtcw-win64-msvc
          path: dist/
          if-no-files-found: error
